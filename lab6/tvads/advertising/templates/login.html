{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реклама в эфире – вход</title>
    <link rel="stylesheet" href="{% static 'css/ads.css' %}">
</head>
<body class="article auth">
<div class="header">
    <img src="{% static 'img/logo.svg' %}" alt="Реклама в эфире">
    {% include 'nav.html' with show_all_link=True %}
</div>
<div class="content">
    <h1>Вход для агентов</h1>
    <form method="POST" class="ad-form auth-form">{% csrf_token %}
        <label>Логин
            <input type="text" name="username" placeholder="Логин"
                   value="{{ form.username }}">
        </label>
        <label>Пароль
            <input type="password" name="password" placeholder="Пароль">
        </label>
        <input type="submit" value="Войти">
        <p class="form-hint">Нет учётной записи? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </form>
    {% if form.errors %}
    <p class="form-errors auth-form">{{ form.errors }}</p>
    {% endif %}
</div>
</body>
</html>
